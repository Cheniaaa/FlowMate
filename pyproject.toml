[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "flowmate"
dynamic = ["version"]
description = "模块化个人 Agent 助理与工作台"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi==0.162.0", "pydantic>=2.12,<3", "uvicorn", "jsonschema==4.26.0"]

[project.optional-dependencies]
models = ["pydantic-ai-slim[openai,anthropic]==2.65.0", "genai-prices==0.2.1"]
code-mode = ["pydantic-monty==1.4.0"]
knowledge = ["lancedb==0.41.0"]
local-embedding = ["fastembed==0.9.1"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx2==2.16.0", "ruff", "packaging"]
packaging = ["pyinstaller==6.22.3"]

[tool.setuptools]
package-dir = {"" = "packages"}

[tool.setuptools.packages.find]
where = ["packages"]
include = ["flowmate", "flowmate.*"]
namespaces = false

[tool.setuptools.package-data]
"flowmate.persistence" = ["schema.sql"]
"flowmate.models" = ["provider_presets.json", "model_metadata.json"]

[tool.setuptools.dynamic]
version = {attr = "flowmate.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--basetemp=.local/tests"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
