[package]
name = "flowmate-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
base64 = "=0.23.1"
uuid = { version = "=1.29.0", features = ["v4"] }
url = "=2.5.8"
tokio = { version = "=1.54.1", features = ["sync", "time"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-global-shortcut = "=2.4.1"

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }
